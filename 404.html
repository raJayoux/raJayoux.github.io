  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--c-ink); color: var(--c-white); }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
    }
    /* the GTA loading card: skewed, 3 px white edge, sky art + vignette */
    .card { position: relative; width: min(1100px, 100%); aspect-ratio: 1344 / 768; min-height: 560px; }
    .card-art {
      position: absolute; inset: 0; overflow: hidden;
      clip-path: polygon(1.34% 4.17%, 98.21% 0, 100% 100%, 0 97.14%);
    }
    .card-art picture, .card-art img { display: block; width: 100%; height: 100%; }
    .card-art img { object-fit: cover; object-position: 50% 40%; }
    .card-art::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 58% 58% at 50% 50%, transparent 62%, rgb(0 0 0 / 0.55) 100%);
    }
    .card-edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--c-white); stroke-width: 3; pointer-events: none; }
    .content {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(560px, calc(100% - 32px));
      display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-16);
    }
    .wordmark { width: min(300px, 70%); height: auto; display: block; margin-bottom: -10px; }
    .panel { display: flex; flex-direction: column; gap: var(--space-12); width: 100%; padding: var(--space-24); }
    .panel > * { margin: 0; }
    .kicker { font: 600 13px/1.15 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-hud-yellow); }
    .title { font: 700 48px/0.95 var(--font-ui); text-transform: uppercase; }
    .addr { font: 600 15px/1.45 var(--font-body); color: var(--c-white); word-break: break-word; }
    .other { font: 400 13px/1.5 var(--font-body); opacity: var(--opacity-secondary); }
    .other span { display: block; }
    .other [lang="zh-Hans"] { font-family: "Noto Sans SC", var(--font-body); }
    .plate { align-self: flex-start; font-size: min(25px, calc((100vw - 80px) / 14.2)); }
    @media (max-width: 600px) {
      .card { aspect-ratio: auto; min-height: 640px; }
      .title { font-size: 38px; }
    }
  </style>
